mlp:
  hidden_sizes: [512, 256, 128, 64, 32]
  dropout: 0.2

knn:
  n_neighbors: 3
  weights: uniform  # uniform|distance

svm_rbf:
  C: 10.0
  gamma: scale  # scale|auto|float

linear_svm:
  C: 1.0

logreg:
  C: 1.0
  max_iter: 2000

naive_bayes: {}

lda:
  solver: svd  # svd|lsqr|eigen

qda:
  reg_param: 0.0

random_forest:
  n_estimators: 500
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1

extra_trees:
  n_estimators: 800
  max_depth: null

ada_boost:
  n_estimators: 400
  learning_rate: 0.05

gbdt:
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 3

xgboost:
  n_estimators: 800
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8

lightgbm:
  n_estimators: 1200
  learning_rate: 0.05
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8

cnn_mel:
  channels: [32, 64, 128]
  dropout: 0.3

lstm_mel:
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  dropout: 0.2

crnn_mel:
  cnn_channels: [32, 64, 128]
  lstm_hidden: 128
  lstm_layers: 2
  dropout: 0.3
